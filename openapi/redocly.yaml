extends:
  - recommended
rules:
  # Le serveur local est volontairement en http.
  no-server-example.com: off
  no-unused-components: warn
  operation-4xx-response: error
  security-defined: error
  # Les sous-schémas d'erreur (`allOf` : Error + précision de `code` / `details`)
  # ne redéclarent pas `message` : sans cette option, Redocly ajoute
  # `unevaluatedProperties: false` à chaque branche et rejette tout exemple
  # d'erreur pourtant conforme.
  no-invalid-media-type-examples:
    severity: warn
    allowAdditionalProperties: true
