openapi: 3.1.0
# Source de vérité de l'API développeurs Labyrinthe Connect, écrite à partir
# du code du backend (routes/api/public-v1.php, contrôleurs Developer/*,
# ressources Developer/*, bootstrap/app.php). Copiée dans le backend
# (docs/openapi.yaml, servie sur /api/public/openapi.yaml) par `npm run sync`.
# Toute évolution de l'API publique commence ici.
info:
  title: Labyrinthe Connect — API développeurs
  version: "1.2.0"
  summary: Envoi de SMS et vérification OTP par API.
  description: |
    API REST JSON pour envoyer des SMS, consulter le solde de crédits et les Sender IDs
    approuvés, et vérifier des numéros de téléphone par OTP (code à usage unique envoyé par SMS).

    ## Authentification
    Chaque requête porte une clé API créée dans l'espace client (Développeurs > Clés API) :

        Authorization: Bearer lsk_live_xxxxxxxxxxxxxxxx

    - `lsk_live_…` : production. Les SMS partent réellement et consomment des crédits.
    - `lsk_test_…` : bac à sable. Fournisseur simulé, **rien n'est envoyé, aucun crédit n'est consommé**.
      Les réponses ont la même forme qu'en production, à deux différences près : le solde n'est pas
      vérifié (`INSUFFICIENT_CREDITS` n'est jamais renvoyé en bac à sable) et `POST /otp/send`
      renvoie le code (`test_code`).

    Une clé peut être restreinte à une liste d'adresses IP (403 `FORBIDDEN` sinon).
    La clé n'est affichée qu'une fois à sa création ; elle doit rester côté serveur,
    **jamais dans une application mobile ou un navigateur**.

    ## Numéros de téléphone
    Format international sans `+` (ex. `243812345678`). Les espaces, tirets et parenthèses sont ignorés.
    L'API accepte :
    - `+243812345678` ou `00243812345678` : l'indicatif fourni est conservé (tous pays) ;
    - `243812345678` : déjà international ;
    - sans `+`, **11 chiffres ou plus ne commençant pas par 0** : déjà international, autre pays
      (`33612345678` reste `33612345678`) ;
    - sinon, format local RDC (`0812345678`, `812345678`), complété avec l'indicatif par défaut de la
      plateforme (243) : `243812345678`.

    Un numéro normalisé doit compter de 8 à 15 chiffres. Pour un numéro étranger court (10 chiffres
    ou moins), toujours utiliser le `+`. Les réponses renvoient toujours le format international sans `+`.

    ## Crédits et segments
    1 crédit = 1 segment SMS. Un message en ASCII (GSM-7) tient en 160 caractères (153 par segment
    au-delà). **Tout caractère non ASCII** (é, à, ç, emoji, tiret long, guillemets typographiques…)
    passe le message en UCS-2 : 70 caractères (67 par segment au-delà), soit un coût souvent doublé.
    Le paramètre `strip_accents` (`POST /sms`, `/sms/estimate`, `/otp/send`) remplace accents et
    caractères typographiques par leur équivalent ASCII. Utiliser `POST /sms/estimate` avant un envoi
    important.

    ## Idempotence
    `POST /sms` et `POST /otp/send` acceptent l'en-tête `Idempotency-Key` (UUID recommandé, 255 caractères
    au maximum). Une requête rejouée avec la même clé dans les 24 h renvoie la même réponse, sans nouvel
    envoi ni débit, avec l'en-tête `Idempotent-Replayed: true`. La clé est propre à la clé API et à
    l'opération (`/sms` et `/otp/send` ont des espaces de clés séparés), et liée au contenu **normalisé**
    de la requête : la même clé avec un autre contenu renvoie `409 IDEMPOTENCY_KEY_REUSED`. Si la requête
    d'origine est encore en cours, `409 IDEMPOTENCY_REQUEST_IN_PROGRESS` (en-tête `Retry-After`) :
    relancer avec la même clé est sans risque. Une requête en erreur n'enregistre pas la clé.

    ## Erreurs
    Toutes les erreurs ont la même forme :

        { "error": { "code": "INSUFFICIENT_CREDITS", "message": "…", "details": { … } } }

    `code` est stable et destiné au code ; `message` est en français et destiné aux humains ;
    `details` est **toujours un objet** (`{}` quand il est vide), dont le contenu dépend du code
    (erreurs par champ pour `VALIDATION_ERROR`). Un SDK doit accepter un code inconnu.

    Erreurs communes à toutes les routes :
    - `404 NOT_FOUND`, message « Route introuvable. » : chemin inexistant ;
    - `405 HTTP_ERROR` : méthode non autorisée sur ce chemin (ex. `DELETE /balance`), avec
      `details.allowed_methods` et l'en-tête `Allow`.

    Ces deux réponses sont décrites dans l'extension `x-common-responses` de ce document.

    ## Identifiant de requête
    Chaque réponse, erreurs comprises, porte l'en-tête `X-Request-Id`, à communiquer au support. Un
    `X-Request-Id` envoyé avec la requête est réutilisé s'il compte 1 à 128 caractères parmi
    `A-Z a-z 0-9 . _ : -` ; sinon un UUID est généré.

    ## Versions
    Chaque réponse de `/api/public/v1` porte l'en-tête `X-Api-Version: 1`. Les **ajouts compatibles**
    (champ de réponse, en-tête, paramètre facultatif, code d'erreur, événement de webhook) arrivent sans
    préavis dans la v1 : une intégration doit ignorer ce qu'elle ne connaît pas. Toute **rupture**
    (champ retiré ou renommé, type ou sens changé, paramètre devenu obligatoire, code HTTP changé) passe
    par une nouvelle version `/api/public/v2`, la v1 restant servie pendant une période de dépréciation
    annoncée. `info.version` de ce document suit SemVer.

    ## Dates
    ISO 8601 avec décalage, à la seconde : `2026-11-06T09:39:11+00:00`.

    ## Limites de débit
    - 120 requêtes / minute **par clé API** sur l'ensemble de l'API ;
    - 10 requêtes / minute **par clé API** sur `POST /otp/send` (compteur séparé) ;
    - 120 requêtes / minute par adresse IP, toutes clés confondues ;
    - limites métier OTP par numéro et par compte (voir `/otp/send`).

    Au-delà : `429 TOO_MANY_REQUESTS`, avec l'en-tête `Retry-After` (secondes) et
    `details.retry_after_seconds`. Les réponses réussies portent aussi `X-RateLimit-Limit` et
    `X-RateLimit-Remaining`.

    ## Webhooks
    Voir la section `webhooks` : événements envoyés en POST JSON, signés en HMAC-SHA256.

    ## Nouveautés 1.2.0
    Toutes compatibles avec la 1.1.0 (ajouts et précisions).
    - En-têtes de réponse `X-Request-Id` (réutilise celui de la requête s'il est valide) et `X-Api-Version: 1` ;
      politique de version documentée.
    - `error.details` toujours un objet (`{}`, jamais `[]`) ; schéma `Error` corrigé (`details` de type objet
      uniquement, `type: string` à côté des `const` des sous-schémas).
    - Messages d'erreur et de validation en français (« Le champ body est obligatoire. ») ; 404 de route
      inconnue « Route introuvable. » ; 405 `HTTP_ERROR` avec `details.allowed_methods` et en-tête `Allow`.
    - Numéros : sans `+`, 11 chiffres ou plus ne commençant pas par 0 = déjà international (`33612345678`
      n'est plus préfixé de 243).
    - Idempotence `POST /sms` : empreinte calculée après normalisation et dédoublonnage des destinataires
      (`0812345678` puis `243812345678` avec la même clé = rejeu) ; nouveau `409 IDEMPOTENCY_REQUEST_IN_PROGRESS`
      (`Retry-After: 5`, `details.retry_after_seconds`).
    - `POST /otp/send` : `Idempotency-Key` ; nouveaux champs de réponse `code_length`, `code_type`,
      `resend_after_seconds` ; nouveaux paramètres `web_otp_domain` (Web OTP API) et `strip_accents` ;
      renvoi accepté tout de suite après une vérification réussie (plus de `OTP_RESEND_TOO_SOON`).
    - `OTP_RESEND_TOO_SOON` et `OTP_RATE_LIMITED` : en-tête `Retry-After` égal à `details.retry_after_seconds`
      (nouveau dans `OTP_RATE_LIMITED`).
    - `POST /otp/verify` : nouveau champ `attempts_remaining`.
    - `POST /sms` et `POST /sms/estimate` : paramètre `strip_accents`. L'estimation dédoublonne les
      destinataires comme l'envoi (`recipients_count` et `total_credits` cohérents avec l'envoi réel).
    - `GET /sms/{id}` : recherche par `id` uniquement.
    - `Message.encoding` jamais `null` ; dates au format `2026-11-06T09:39:11+00:00` partout.
    - Webhook `message.status_changed` enrichi (`reference`, `error_code`, `error_message`) ; nouveaux
      webhooks `otp.verified` et `otp.failed`.
  contact:
    name: Labyrinthe Connect
    email: connect@labyrinthe-rdc.com
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.labyrinthe-rdc.com/api/public/v1
    description: Production
  - url: http://localhost:8000/api/public/v1
    description: Local (développement)

security:
  - ApiKeyAuth: []

tags:
  - name: SMS
    description: Envoi et suivi de messages.
  - name: Compte
    description: Solde de crédits et Sender IDs.
  - name: OTP
    description: |
      OTP as a service. Parcours type, depuis le serveur de l'intégrateur :
      1. `POST /otp/send` avec le numéro → conserver `otp_id` (session côté serveur) ;
      2. l'utilisateur saisit le code reçu par SMS (`code_length` et `code_type` indiquent sa forme) ;
      3. `POST /otp/verify` avec `otp_id` et le code → `verified: true` ou un motif d'échec.

      Le code n'est jamais renvoyé par l'API en production (il est stocké haché). Longueur, alphabet,
      validité, nombre de tentatives, délai anti-renvoi, Sender ID et modèle de message viennent des
      paramètres OTP du compte (espace client > Vérification OTP), dans les bornes de la plateforme.
      L'issue de chaque vérification est aussi notifiée par les webhooks `otp.verified` et `otp.failed`.

# Réponses communes à toutes les routes, non rattachées à une opération
# (OpenAPI n'a pas de réponses globales) : référencées ici pour la
# documentation, les SDK et le test de contrat.
x-common-responses:
  '404':
    description: "`NOT_FOUND` : chemin inexistant (toutes routes)."
    headers:
      X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
    content:
      application/json:
        schema: { $ref: '#/components/schemas/Error' }
        example: { error: { code: NOT_FOUND, message: "Route introuvable.", details: {} } }
  '405':
    description: "`HTTP_ERROR` : méthode non autorisée sur ce chemin (toutes routes, ex. `DELETE /balance`)."
    headers:
      X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
      Allow:
        description: Méthodes acceptées sur ce chemin (ex. `GET, HEAD`).
        schema: { type: string }
    content:
      application/json:
        schema:
          allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                error:
                  type: object
                  required: [details]
                  properties:
                    code: { type: string, const: HTTP_ERROR }
                    details:
                      type: object
                      required: [allowed_methods]
                      properties:
                        allowed_methods:
                          type: array
                          items: { type: string }
        example: { error: { code: HTTP_ERROR, message: "La méthode DELETE n'est pas autorisée pour cette route.", details: { allowed_methods: ["GET", "HEAD"] } } }

paths:
  /sms:
    post:
      tags: [SMS]
      operationId: sendSms
      summary: Envoyer un ou plusieurs SMS
      description: |
        Envoi asynchrone : `202 Accepted` confirme la mise en file et le débit des crédits,
        pas la livraison. Suivre ensuite le statut par webhook `message.status_changed`
        ou par `GET /sms/{id}`.

        Fournir `recipient` (un numéro) **ou** `recipients` (jusqu'à 1000), pas les deux.
        Un message est créé par destinataire ; les doublons de la liste sont fusionnés après
        normalisation (`0812345678` et `243812345678` sont le même numéro).

        **Tout ou rien** : tous les destinataires, le Sender ID et le solde sont vérifiés avant
        le moindre envoi. Si un seul destinataire est refusé, rien n'est envoyé et l'erreur
        `RECIPIENT_NOT_SENDABLE` liste tous les refus (`details.rejected`). Si le solde ne couvre pas
        tout l'envoi, rien n'est envoyé (`INSUFFICIENT_CREDITS`, jamais avec une clé de test).

        **Idempotence** (voir l'introduction) : l'empreinte porte sur les destinataires normalisés et
        dédoublonnés, `body` (après `strip_accents`), `sender` et `reference`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSmsRequest'
            examples:
              unitaire:
                summary: Un destinataire
                value: { recipient: "243812345678", body: "Votre commande 1042 est prête." }
              plusieurs:
                summary: Plusieurs destinataires, avec référence
                value: { recipients: ["243812345678", "0899999999"], body: "Rappel : reunion demain 9h.", sender: "MABOUTIQUE", reference: "RAPPEL-2026-11-06" }
              sansAccents:
                summary: Accents retirés (GSM-7, coût réduit)
                value: { recipient: "33612345678", body: "Votre réservation à l'hôtel est confirmée.", strip_accents: true }
      responses:
        '202':
          description: Message(s) mis en file d'envoi.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            Idempotent-Replayed: { $ref: '#/components/headers/Idempotent-Replayed' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
              example:
                data:
                  - id: "9d5c0a3e-6f0b-4c2e-9a51-3b7f2d8e4c10"
                    reference: null
                    recipient: "243812345678"
                    sender: "LabConnect"
                    encoding: ucs2
                    status: queued
                    segments: 1
                    credits_charged: 1
                    campaign_id: null
                    provider_message_id: null
                    error_code: null
                    error_message: null
                    created_at: "2026-11-06T09:39:11+00:00"
                    submitted_at: null
                    delivered_at: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            - `INSUFFICIENT_CREDITS` : le solde ne couvre pas l'envoi (rien n'est envoyé) ;
            - `IDEMPOTENCY_KEY_REUSED` : `Idempotency-Key` déjà utilisée pour une requête différente ;
            - `IDEMPOTENCY_KEY_UNRESOLVED` : la requête d'origine avec cette clé a échoué de façon inattendue, son résultat est inconnu (un SMS a pu partir) ; ne pas relancer automatiquement, vérifier puis renvoyer avec une nouvelle clé ;
            - `IDEMPOTENCY_REQUEST_IN_PROGRESS` : la requête d'origine avec cette clé est encore en cours
              (en-tête `Retry-After`) ; relancer avec la même clé.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            Retry-After: { $ref: '#/components/headers/Retry-After-Idempotency' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/InsufficientCreditsError'
                  - $ref: '#/components/schemas/IdempotencyInProgressError'
                  - $ref: '#/components/schemas/Error'
              examples:
                credits:
                  value: { error: { code: INSUFFICIENT_CREDITS, message: "Solde de crédits insuffisant pour cet envoi. Aucun message envoyé.", details: { available: 3, required: 4 } } }
                cleReutilisee:
                  value: { error: { code: IDEMPOTENCY_KEY_REUSED, message: "Cette clé d'idempotence a déjà servi pour une requête différente.", details: {} } }
                enCours:
                  value: { error: { code: IDEMPOTENCY_REQUEST_IN_PROGRESS, message: "Une requête avec cette clé d'idempotence est encore en cours de traitement. Réessayez dans quelques secondes avec la même clé.", details: { retry_after_seconds: 5 } } }
        '422':
          description: |
            - `VALIDATION_ERROR` : champ manquant ou invalide (`details` par champ), ou
              `Idempotency-Key` de plus de 255 caractères (`details["Idempotency-Key"]`) ;
            - `RECIPIENT_NOT_SENDABLE` : un ou plusieurs numéros invalides, en liste noire ou désinscrits
              (`details.rejected`, rien n'est envoyé) ;
            - `SENDER_ID_NOT_APPROVED` : `sender` n'est pas un Sender ID approuvé du compte.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/RecipientNotSendableError'
                  - $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value: { error: { code: VALIDATION_ERROR, message: "Les données envoyées sont invalides.", details: { body: ["Le champ body est obligatoire."] } } }
                refus:
                  value: { error: { code: RECIPIENT_NOT_SENDABLE, message: "Destinataire non envoyable : invalid_phone. Aucun message envoyé.", details: { reason: invalid_phone, rejected: [{ recipient: "12", reason: invalid_phone }] } } }
                senderId:
                  value: { error: { code: SENDER_ID_NOT_APPROVED, message: "Ce Sender ID n'est pas approuvé pour ce compte.", details: {} } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    get:
      tags: [SMS]
      operationId: listSms
      summary: Lister les messages envoyés avec cette clé API
      description: |
        Messages créés par **la clé API appelante** (pas ceux des autres clés ni de l'espace client),
        du plus récent au plus ancien : chaque intégration suit ses propres envois. Pour un message
        reçu autrement (webhook, support), `GET /sms/{id}` cherche dans tout le compte.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MessageStatus' }
        - name: recipient
          in: query
          description: Numéro (tous formats acceptés, normalisé avant la recherche).
          schema: { type: string, maxLength: 32 }
        - name: reference
          in: query
          description: Référence fournie à l'envoi (correspondance exacte).
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          description: Date ou date-heure ISO 8601 (incluse).
          schema: { type: string, examples: ["2026-11-01", "2026-11-01T08:00:00+00:00"] }
        - name: to
          in: query
          description: Date (journée entière incluse) ou date-heure ISO 8601. Postérieure ou égale à `from`.
          schema: { type: string, examples: ["2026-11-30"] }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Page de messages.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Message' }
                  - $ref: '#/components/schemas/Paginated'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sms/estimate:
    post:
      tags: [SMS]
      operationId: estimateSms
      summary: Estimer le coût d'un envoi
      description: |
        Calcule l'encodage, le nombre de segments et les crédits nécessaires, sans rien envoyer.
        Les destinataires sont comptés comme à l'envoi : normalisés, doublons fusionnés, numéros
        invalides ignorés (pas d'erreur). Les numéros en liste noire ou désinscrits sont comptés
        (`POST /sms` les refuserait).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstimateSmsRequest' }
            example: { body: "Votre code est 482913", recipients: ["243812345678", "0812345678", "0899999999"] }
      responses:
        '200':
          description: Estimation.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Estimate' }
              example:
                data: { encoding: gsm7, characters: 21, segments_per_message: 1, recipients_count: 2, total_credits: 2, balance_after: 98 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sms/{id}:
    get:
      tags: [SMS]
      operationId: getSms
      summary: Détail d'un message
      description: |
        Recherche **par `id` uniquement**, dans tous les messages du compte (quelle que soit la clé
        ou l'espace qui les a envoyés : identifiant reçu par webhook, support). La liste `GET /sms`,
        elle, ne montre que les messages de la clé appelante.
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant du message (`id`). Toute autre valeur renvoie 404.
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Message.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /balance:
    get:
      tags: [Compte]
      operationId: getBalance
      summary: Solde de crédits SMS
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solde courant.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Balance' }
              example: { data: { balance: 1250, held: 0 } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sender-ids:
    get:
      tags: [Compte]
      operationId: listSenderIds
      summary: Sender IDs approuvés
      description: |
        Noms d'expéditeur utilisables dans le champ `sender` de `POST /sms`. Sans `sender`,
        l'expéditeur par défaut de la plateforme est utilisé.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Sender IDs au statut `approved`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SenderId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /otp/send:
    post:
      tags: [OTP]
      operationId: sendOtp
      summary: Envoyer un code de vérification par SMS
      description: |
        Génère un code, l'envoie par SMS (même pipeline, même coût en crédits qu'un SMS normal)
        et renvoie `otp_id`, ainsi que la forme du code (`code_length`, `code_type`) et le délai
        avant un renvoi possible (`resend_after_seconds`). Un nouvel envoi au même numéro
        **invalide le code précédent** (sa vérification renvoie `expired`).

        Avec une clé `lsk_test_…`, aucun SMS n'est envoyé et la réponse contient le code
        (`test_code`) pour tester `/otp/verify` de bout en bout. Jamais avec une clé live.

        **Idempotence** (voir l'introduction) : avec `Idempotency-Key`, un rejeu dans les 24 h renvoie
        la même réponse `201` (même `otp_id`, même `test_code` en mode test), sans nouveau SMS ni débit,
        avec `Idempotent-Replayed: true`. L'empreinte porte sur le numéro normalisé, `template`,
        `locale`, `web_otp_domain` et `strip_accents`. Espace de clés séparé de `POST /sms`.

        Limites :
        - 10 requêtes / minute par clé API (`429 TOO_MANY_REQUESTS`) ;
        - délai minimal entre deux envois au même numéro tant que le dernier code n'est pas vérifié
          (`429 OTP_RESEND_TOO_SOON`) ; après une vérification réussie, un nouvel envoi est accepté
          tout de suite ;
        - plafond sur une heure glissante, par numéro et par compte (`429 OTP_RATE_LIMITED`,
          `details.scope`, `details.limit`).

        Les deux erreurs métier portent l'en-tête `Retry-After`, égal à `details.retry_after_seconds`.

        Ne jamais relancer automatiquement cet appel sans `Idempotency-Key` : chaque succès envoie un SMS facturé.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendOtpRequest' }
            examples:
              defaut:
                summary: Paramètres du compte
                value: { phone: "243812345678" }
              personnalise:
                summary: Modèle et langue imposés
                value: { phone: "0812345678", template: "Votre code MaBoutique : {code}. Valable {minutes} min.", locale: fr }
              webOtp:
                summary: Remplissage automatique (Web OTP API), sans accents
                value: { phone: "+33612345678", web_otp_domain: "app.exemple.com", strip_accents: true }
      responses:
        '201':
          description: Code généré et envoyé (ou rejeu d'une requête précédente avec la même `Idempotency-Key`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            Idempotent-Replayed: { $ref: '#/components/headers/Idempotent-Replayed' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OtpSendResult' }
              examples:
                live:
                  summary: Clé live
                  value: { data: { otp_id: "9d5c0a3e-6f0b-4c2e-9a51-3b7f2d8e4c10", expires_at: "2026-11-06T09:49:11+00:00", max_attempts: 5, code_length: 6, code_type: numeric, resend_after_seconds: 60 } }
                test:
                  summary: Clé de test (test_code)
                  value: { data: { otp_id: "9d5c0a3e-6f0b-4c2e-9a51-3b7f2d8e4c10", expires_at: "2026-11-06T09:49:11+00:00", max_attempts: 5, code_length: 6, code_type: numeric, resend_after_seconds: 60, test_code: "482913" } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            - `FORBIDDEN` : adresse IP non autorisée pour cette clé ;
            - `ACCOUNT_SUSPENDED` : compte suspendu par la plateforme ;
            - `OTP_DISABLED_FOR_ACCOUNT` : service OTP désactivé pour ce compte par la plateforme.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            - `INSUFFICIENT_CREDITS` : crédits insuffisants (jamais avec une clé de test) ;
            - `IDEMPOTENCY_KEY_REUSED` : `Idempotency-Key` déjà utilisée pour une requête différente ;
            - `IDEMPOTENCY_KEY_UNRESOLVED` : la requête d'origine avec cette clé a échoué de façon inattendue, son résultat est inconnu (un SMS a pu partir) ; ne pas relancer automatiquement, vérifier puis renvoyer avec une nouvelle clé ;
            - `IDEMPOTENCY_REQUEST_IN_PROGRESS` : la requête d'origine avec cette clé est encore en cours
              (en-tête `Retry-After`) ; relancer avec la même clé.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            Retry-After: { $ref: '#/components/headers/Retry-After-Idempotency' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/InsufficientCreditsError'
                  - $ref: '#/components/schemas/IdempotencyInProgressError'
                  - $ref: '#/components/schemas/Error'
        '422':
          description: |
            - `VALIDATION_ERROR` : champ invalide (`details` par champ, dont `web_otp_domain`), ou
              `Idempotency-Key` de plus de 255 caractères ;
            - `INVALID_PHONE` : numéro inexploitable ;
            - `INVALID_OTP_TEMPLATE` : `template` sans le jeton `{code}` ;
            - `RECIPIENT_NOT_SENDABLE` : numéro en liste noire ou désinscrit ;
            - `SENDER_ID_NOT_APPROVED` : le Sender ID des paramètres OTP n'est plus approuvé.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/RecipientNotSendableError'
                  - $ref: '#/components/schemas/Error'
              examples:
                domaine:
                  value: { error: { code: VALIDATION_ERROR, message: "Les données envoyées sont invalides.", details: { web_otp_domain: ["Le champ web_otp_domain doit être un nom d'hôte valide, sans schéma ni port (ex. exemple.com)."] } } }
                modele:
                  value: { error: { code: INVALID_OTP_TEMPLATE, message: "Le template doit contenir le jeton '{code}'.", details: {} } }
        '429':
          description: |
            - `TOO_MANY_REQUESTS` : limite de requêtes ;
            - `OTP_RESEND_TOO_SOON` : renvoi trop rapproché ;
            - `OTP_RATE_LIMITED` : plafond horaire atteint (`details.scope` = `phone` | `account`).

            Toujours avec l'en-tête `Retry-After`, égal à `details.retry_after_seconds`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            Retry-After: { $ref: '#/components/headers/Retry-After' }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OtpResendTooSoonError'
                  - $ref: '#/components/schemas/OtpRateLimitedError'
                  - $ref: '#/components/schemas/TooManyRequestsError'
              examples:
                renvoi:
                  value: { error: { code: OTP_RESEND_TOO_SOON, message: "Un code vient d'être envoyé à ce numéro. Réessayez dans 42 s.", details: { retry_after_seconds: 42 } } }
                plafond:
                  value: { error: { code: OTP_RATE_LIMITED, message: "Trop de codes envoyés à ce numéro sur la dernière heure.", details: { retry_after_seconds: 1800, scope: phone, limit: 5 } } }
        '503':
          description: "`OTP_SERVICE_DISABLED` : service OTP momentanément coupé sur la plateforme."
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /otp/verify:
    post:
      tags: [OTP]
      operationId: verifyOtp
      summary: Vérifier un code OTP
      description: |
        Un code incorrect n'est **pas** une erreur HTTP : la réponse est `200` avec
        `verified: false` et un motif. Chaque essai incorrect consomme une tentative
        (`attempts_remaining`) ; au-delà du maximum, le code est définitivement bloqué
        (`max_attempts_reached`). Le code saisi est normalisé (espaces retirés, insensible à la casse).

        Une fois conclue (code correct, tentatives épuisées, expiration constatée), la vérification est
        figée : les appels suivants renvoient le même motif sans rien compter, et un webhook
        `otp.verified` ou `otp.failed` est émis une seule fois.

        Gratuit. Un `otp_id` d'un autre compte renvoie 404.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
            example: { otp_id: "9d5c0a3e-6f0b-4c2e-9a51-3b7f2d8e4c10", code: "482913" }
      responses:
        '200':
          description: Résultat de la vérification.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OtpVerifyResult' }
              examples:
                valide:
                  value: { data: { verified: true, reason: null, attempts_remaining: null } }
                incorrect:
                  value: { data: { verified: false, reason: invalid_code, attempts_remaining: 4 } }
                bloque:
                  value: { data: { verified: false, reason: max_attempts_reached, attempts_remaining: 0 } }
                expire:
                  value: { data: { verified: false, reason: expired, attempts_remaining: null } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

webhooks:
  message.status_changed:
    post:
      operationId: onMessageStatusChanged
      summary: Le statut d'un message a changé
      description: |
        Envoyé à chaque changement de statut d'un message du compte (API, espace client ou campagne).
        Voir `WebhookEnvelope` pour la signature et les règles de livraison.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { type: string, const: message.status_changed }
                    data: { $ref: '#/components/schemas/MessageStatusChangedData' }
            example:
              id: "1f0c7e52-8d3a-4b6e-9c2f-5a7d1e3b9f40"
              event: message.status_changed
              data:
                message_id: "9d5c0a3e-6f0b-4c2e-9a51-3b7f2d8e4c10"
                recipient: "243812345678"
                status: delivered
                provider_message_id: "DD-88231"
                campaign_id: null
                reference: "CMD-1042"
                error_code: null
                error_message: null
              timestamp: 1793952000
      responses:
        '200':
          description: Toute réponse 2xx accuse réception. Sinon, nouvel essai.
  campaign.completed:
    post:
      operationId: onCampaignCompleted
      summary: Une campagne est terminée
      description: Tous les messages de la campagne ont atteint un statut final (ou plus aucun n'est en file).
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { type: string, const: campaign.completed }
                    data: { $ref: '#/components/schemas/CampaignCompletedData' }
            example:
              id: "7b2e4c10-3f5a-4d8e-a1b9-0c6d2e8f4a71"
              event: campaign.completed
              data:
                campaign_id: "3c9a1f7e-2b4d-4e6a-8f0c-9d1b5e7a3c20"
                name: "Promo de novembre"
                recipients_count: 1200
                messages_by_status: { delivered: 1150, failed: 30, undeliverable: 20 }
                credits_charged: 1200
                completed_at: "2026-11-06T10:15:00+00:00"
              timestamp: 1794046500
      responses:
        '200':
          description: Accusé de réception.
  balance.low:
    post:
      operationId: onBalanceLow
      summary: Le solde est passé sous le seuil du compte
      description: |
        Émis une fois quand le solde passe sous le seuil de solde bas du compte (réglé dans l'espace
        client). Il n'est émis à nouveau qu'après être repassé au-dessus (achat, crédit).
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { type: string, const: balance.low }
                    data: { $ref: '#/components/schemas/BalanceLowData' }
            example:
              id: "c4d8e2a0-6b1f-4a3c-9e7d-2f5b8a1c6e93"
              event: balance.low
              data: { balance: 950, threshold: 1000 }
              timestamp: 1794046500
      responses:
        '200':
          description: Accusé de réception.
  otp.verified:
    post:
      operationId: onOtpVerified
      summary: Un code OTP a été vérifié
      description: |
        Émis une seule fois, après validation, quand `POST /otp/verify` reçoit le bon code. Concerne
        toutes les vérifications du compte : API développeurs et console OTP de l'espace client.
        Ne contient jamais le code.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { type: string, const: otp.verified }
                    data: { $ref: '#/components/schemas/OtpWebhookData' }
            example:
              id: "2a7d9c41-5e3b-4f8a-b0c6-1d4e7f2a9b35"
              event: otp.verified
              data:
                otp_id: "9d5c0a3e-6f0b-4c2e-9a51-3b7f2d8e4c10"
                phone: "243812345678"
                status: verified
                reason: null
                verified_at: "2026-11-06T09:41:02+00:00"
              timestamp: 1794044462
      responses:
        '200':
          description: Accusé de réception.
  otp.failed:
    post:
      operationId: onOtpFailed
      summary: Une vérification OTP a échoué définitivement
      description: |
        Émis une seule fois, après validation, quand `POST /otp/verify` épuise les tentatives
        (`status: failed`, `reason: max_attempts_reached`) ou constate l'expiration du code
        (`status: expired`, `reason: expired`). Un code faux qui laisse des tentatives n'émet rien ;
        un code invalidé par un renvoi non plus. Concerne l'API développeurs et la console OTP de
        l'espace client.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { type: string, const: otp.failed }
                    data: { $ref: '#/components/schemas/OtpWebhookData' }
            example:
              id: "8e1b3d6f-0a2c-4e5b-9d7f-3c6a8e0b2d14"
              event: otp.failed
              data:
                otp_id: "9d5c0a3e-6f0b-4c2e-9a51-3b7f2d8e4c10"
                phone: "243812345678"
                status: failed
                reason: max_attempts_reached
                verified_at: null
              timestamp: 1794044462
      responses:
        '200':
          description: Accusé de réception.
  test.ping:
    post:
      operationId: onTestPing
      summary: Événement de test
      description: Envoyé uniquement par le bouton « Tester » de l'espace client (Développeurs > Webhooks).
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { type: string, const: test.ping }
                    data: { type: object }
      responses:
        '200':
          description: Accusé de réception.

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "lsk_live_… | lsk_test_…"
      description: Clé API du compte. À garder côté serveur.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Identifiant unique de la requête (UUID recommandé). Conservé 24 h, par clé API et par
        opération. Plus de 255 caractères : `422 VALIDATION_ERROR`.
      schema: { type: string, minLength: 1, maxLength: 255 }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Identifiant de requête de l'appelant, renvoyé tel quel dans l'en-tête de réponse `X-Request-Id`
        s'il est valide (sinon remplacé par un UUID).
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    WebhookSignature:
      name: X-Signature
      in: header
      required: true
      description: "`sha256=` suivi du HMAC-SHA256 hexadécimal du corps brut, avec le secret de l'endpoint."
      schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }

  headers:
    X-Request-Id:
      description: |
        Identifiant de la requête (celui de l'appelant s'il est valide, sinon un UUID). Présent sur
        toutes les réponses ; à communiquer au support.
      schema: { type: string, examples: ["5f0c2b9e-1d3a-4e7f-8b6c-9a0d2e4f6b81"] }
    X-Api-Version:
      description: Version majeure de l'API qui a servi la réponse.
      schema: { type: string, const: '1' }
    X-RateLimit-Limit:
      description: Nombre de requêtes autorisées par minute.
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requêtes restantes dans la minute en cours.
      schema: { type: integer }
    Idempotent-Replayed:
      description: "`true` si la réponse est le rejeu d'une requête précédente (même `Idempotency-Key`)."
      schema: { type: string, enum: ['true'] }
    Retry-After:
      description: Secondes à attendre avant de réessayer (égal à `details.retry_after_seconds`).
      schema: { type: integer, minimum: 1 }
    Retry-After-Idempotency:
      description: "Avec `IDEMPOTENCY_REQUEST_IN_PROGRESS` uniquement : secondes à attendre (5) avant de relancer avec la même clé."
      schema: { type: integer, minimum: 1 }

  schemas:
    PhoneNumber:
      type: string
      maxLength: 32
      description: |
        Numéro international (`243812345678`, `+33612345678`, `00243812345678`, ou sans `+` à partir de
        11 chiffres ne commençant pas par 0 : `33612345678`) ou format local RDC (`0812345678`,
        `812345678`). Voir « Numéros de téléphone » dans l'introduction.
      examples: ["243812345678", "+243812345678", "0812345678", "33612345678"]

    SendSmsRequest:
      type: object
      required: [body]
      properties:
        recipient:
          $ref: '#/components/schemas/PhoneNumber'
          description: Un destinataire (alternative à `recipients`).
        recipients:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/PhoneNumber' }
          description: Plusieurs destinataires (alternative à `recipient`, interdit avec lui). Tout ou rien.
        body:
          type: string
          minLength: 1
          maxLength: 1600
        sender:
          type: string
          maxLength: 11
          description: Sender ID approuvé du compte. Par défaut, l'expéditeur de la plateforme.
        reference:
          type: string
          maxLength: 64
          description: |
            Référence libre de l'intégrateur (n° de commande…), renvoyée dans `Message.reference`
            et dans le webhook `message.status_changed`, filtrable (`GET /sms?reference=`). Non unique :
            un envoi multiple la partage.
        strip_accents:
          $ref: '#/components/schemas/StripAccents'

    StripAccents:
      type: boolean
      default: false
      description: |
        Remplace accents et caractères typographiques (guillemets, tirets longs…) par leur équivalent
        ASCII avant l'envoi : le message passe en GSM-7, souvent deux fois moins cher. Jamais appliqué
        sans ce paramètre. La translittération dépend du serveur (`Café` peut devenir `Cafe` ou `Caf'e`) :
        ne pas en dépendre pour un texte exact. Accepte aussi `0`, `1`, `"0"`, `"1"`.

    EstimateSmsRequest:
      type: object
      required: [body, recipients]
      properties:
        body: { type: string, minLength: 1, maxLength: 1600 }
        recipients:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PhoneNumber' }
        strip_accents:
          $ref: '#/components/schemas/StripAccents'

    MessageStatus:
      type: string
      description: |
        - `queued` : en file chez Labyrinthe ;
        - `submitted` : transmis au fournisseur ;
        - `sent` : accepté par l'opérateur ;
        - `delivered` : remis au téléphone (final) ;
        - `failed`, `rejected`, `expired`, `undeliverable` : échec (final).
      enum: [queued, submitted, sent, delivered, failed, rejected, expired, undeliverable]

    Encoding:
      type: string
      description: "`gsm7` (ASCII, 160 / 153 caractères par segment) ou `ucs2` (70 / 67)."
      enum: [gsm7, ucs2]

    Message:
      type: object
      description: Le texte du message n'est pas renvoyé (il peut contenir un code OTP).
      required: [id, reference, recipient, sender, encoding, status, segments, credits_charged, campaign_id,
        provider_message_id, error_code, error_message, created_at, submitted_at, delivered_at]
      properties:
        id: { type: string, format: uuid }
        reference: { type: [string, 'null'], description: Référence fournie à l'envoi. }
        recipient: { type: string, examples: ["243812345678"] }
        sender: { type: string, description: Expéditeur affiché sur le téléphone. }
        encoding:
          $ref: '#/components/schemas/Encoding'
          description: Jamais `null`.
        status: { $ref: '#/components/schemas/MessageStatus' }
        segments: { type: integer, minimum: 1 }
        credits_charged:
          type: integer
          minimum: 0
          description: Crédits débités (égal à `segments` ; débit fictif avec une clé de test).
        campaign_id: { type: [string, 'null'], description: Campagne d'origine (messages envoyés depuis l'espace client). }
        provider_message_id: { type: [string, 'null'] }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time, examples: ["2026-11-06T09:39:11+00:00"] }
        submitted_at: { type: [string, 'null'], format: date-time, description: Transmission au fournisseur. }
        delivered_at: { type: [string, 'null'], format: date-time, description: Accusé de remise. }

    Estimate:
      type: object
      required: [encoding, characters, segments_per_message, recipients_count, total_credits, balance_after]
      properties:
        encoding: { $ref: '#/components/schemas/Encoding' }
        characters: { type: integer, description: Caractères du texte (après `strip_accents`). }
        segments_per_message: { type: integer }
        recipients_count:
          type: integer
          description: Destinataires valides, après normalisation et fusion des doublons (comme à l'envoi).
        total_credits: { type: integer, description: "`segments_per_message` × `recipients_count`." }
        balance_after:
          type: [integer, 'null']
          description: Solde après envoi (négatif si insuffisant) ; `null` si le compte n'a jamais eu de crédits.

    Balance:
      type: object
      required: [balance, held]
      properties:
        balance: { type: integer, description: Crédits disponibles. }
        held: { type: integer, description: Crédits bloqués par des campagnes en cours. }

    SenderIdStatus:
      type: string
      enum: [pending, pending_provider, approved, rejected, suspended]

    SenderId:
      type: object
      required: [id, value, status, is_default]
      properties:
        id: { type: string, format: uuid }
        value: { type: string, maxLength: 11, examples: ["MABOUTIQUE"] }
        status: { $ref: '#/components/schemas/SenderIdStatus' }
        purpose: { type: [string, 'null'] }
        rejection_reason: { type: [string, 'null'] }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time, examples: ["2026-11-06T09:39:11+00:00"] }

    SendOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        template:
          type: string
          maxLength: 1600
          description: |
            Doit contenir `{code}`. Jetons facultatifs : `{app_name}`, `{minutes}`.
            Par défaut : modèle des paramètres OTP du compte, sinon modèle standard de la langue.
        locale:
          type: string
          enum: [fr, en]
          description: Langue du modèle standard. Par défaut, celle des paramètres OTP du compte.
        web_otp_domain:
          type: string
          maxLength: 253
          pattern: '^(?=.{1,253}$)([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$'
          description: |
            [Web OTP API](https://developer.mozilla.org/docs/Web/API/WebOTP_API) : nom d'hôte du site qui
            lira le code (au moins deux libellés, sans schéma, port ni chemin ; mis en minuscules). Ajoute
            la dernière ligne `@<domaine> #<code>` au SMS, pour le remplissage automatique (Chrome, Android).
            Valeur invalide : `422 VALIDATION_ERROR`.
          examples: ["app.exemple.com"]
        strip_accents:
          $ref: '#/components/schemas/StripAccents'

    OtpSendResult:
      type: object
      required: [otp_id, expires_at, max_attempts, code_length, code_type, resend_after_seconds]
      properties:
        otp_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time, examples: ["2026-11-06T09:49:11+00:00"] }
        max_attempts: { type: integer, minimum: 1 }
        code_length:
          type: integer
          minimum: 4
          maximum: 8
          description: Nombre de caractères du code (paramètres OTP du compte).
        code_type:
          type: string
          enum: [numeric, alphanumeric]
          description: |
            `numeric` : chiffres 0-9. `alphanumeric` : majuscules et chiffres sans caractères ambigus
            (`ABCDEFGHJKMNPQRSTUVWXYZ23456789`) ; la saisie est insensible à la casse.
        resend_after_seconds:
          type: integer
          minimum: 0
          description: |
            Délai anti-renvoi : secondes avant qu'un nouvel envoi au même numéro soit accepté tant que ce
            code n'est pas vérifié. Permet d'afficher un compte à rebours « Renvoyer le code ».
        test_code:
          type: string
          description: Présent **uniquement** avec une clé `lsk_test_…` (aucun SMS envoyé). Jamais en live.

    VerifyOtpRequest:
      type: object
      required: [otp_id, code]
      properties:
        otp_id: { type: string }
        code: { type: string, maxLength: 20 }

    OtpVerifyResult:
      type: object
      required: [verified, reason, attempts_remaining]
      properties:
        verified: { type: boolean }
        reason:
          description: |
            `null` si `verified` est vrai.
            - `invalid_code` : code faux, il reste des tentatives ;
            - `max_attempts_reached` : tentatives épuisées, code bloqué ;
            - `expired` : code expiré, ou invalidé par un nouvel envoi au même numéro ;
            - `already_used` : code déjà vérifié.
          oneOf:
            - type: 'null'
            - type: string
              enum: [invalid_code, expired, already_used, max_attempts_reached]
        attempts_remaining:
          type: [integer, 'null']
          minimum: 0
          description: |
            Tentatives encore possibles : entier après `invalid_code`, `0` avec `max_attempts_reached`,
            `null` si le code est vérifié, déjà utilisé ou expiré.

    Paginated:
      type: object
      description: Pagination standard (liens et métadonnées).
      required: [links, meta]
      properties:
        links:
          type: object
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer }
            from: { type: [integer, 'null'] }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: [integer, 'null'] }
            total: { type: integer }

    ErrorCode:
      type: string
      description: |
        Codes connus (liste ouverte : un SDK doit accepter un code inconnu).
      examples:
        - UNAUTHENTICATED
        - FORBIDDEN
        - ACCOUNT_SUSPENDED
        - NOT_FOUND
        - VALIDATION_ERROR
        - TOO_MANY_REQUESTS
        - INSUFFICIENT_CREDITS
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_UNRESOLVED
        - IDEMPOTENCY_REQUEST_IN_PROGRESS
        - RECIPIENT_NOT_SENDABLE
        - SENDER_ID_NOT_APPROVED
        - INVALID_PHONE
        - INVALID_OTP_TEMPLATE
        - OTP_RESEND_TOO_SOON
        - OTP_RATE_LIMITED
        - OTP_DISABLED_FOR_ACCOUNT
        - OTP_SERVICE_DISABLED
        - HTTP_ERROR

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 'Message en français, destiné aux humains.' }
            details:
              type: object
              description: Toujours un objet (`{}` quand il est vide) ; contenu selon `code`.

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, const: VALIDATION_ERROR }
                details:
                  type: object
                  description: Messages d'erreur (en français) par champ, sous le nom exact du champ.
                  additionalProperties:
                    type: array
                    items: { type: string }
                  examples:
                    - { body: ["Le champ body est obligatoire."] }
                    - { per_page: ["Le champ per_page ne doit pas être supérieur à 100."] }

    InsufficientCreditsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, const: INSUFFICIENT_CREDITS }
                details:
                  type: object
                  required: [available, required]
                  properties:
                    available: { type: integer }
                    required: { type: integer }

    IdempotencyInProgressError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, const: IDEMPOTENCY_REQUEST_IN_PROGRESS }
                details:
                  type: object
                  required: [retry_after_seconds]
                  properties:
                    retry_after_seconds: { type: integer, minimum: 1 }

    RecipientNotSendableError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, const: RECIPIENT_NOT_SENDABLE }
                details:
                  type: object
                  required: [reason]
                  properties:
                    reason:
                      $ref: '#/components/schemas/RejectionReason'
                      description: Motif du premier refus.
                    rejected:
                      type: array
                      description: Tous les destinataires refusés (envoi `POST /sms`).
                      items:
                        type: object
                        required: [recipient, reason]
                        properties:
                          recipient: { type: string, description: "Numéro tel que reçu (invalide), ou normalisé." }
                          reason: { $ref: '#/components/schemas/RejectionReason' }

    RejectionReason:
      type: string
      enum: [invalid_phone, blacklisted, opted_out]

    TooManyRequestsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, const: TOO_MANY_REQUESTS }
                details:
                  type: object
                  properties:
                    retry_after_seconds: { type: integer, minimum: 0 }

    OtpResendTooSoonError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, const: OTP_RESEND_TOO_SOON }
                details:
                  type: object
                  required: [retry_after_seconds]
                  properties:
                    retry_after_seconds: { type: integer, minimum: 1 }

    OtpRateLimitedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, const: OTP_RATE_LIMITED }
                details:
                  type: object
                  required: [retry_after_seconds, scope, limit]
                  properties:
                    retry_after_seconds:
                      type: integer
                      minimum: 1
                      description: Délai avant que la fenêtre glissante d'une heure repasse sous la limite.
                    scope: { type: string, enum: [phone, account] }
                    limit: { type: integer }

    WebhookEnvelope:
      type: object
      description: |
        Corps de chaque événement webhook, envoyé en `POST` `application/json`.

        **Vérification** : calculer `HMAC-SHA256(secret, corps brut)` en hexadécimal et comparer en
        temps constant à l'en-tête `X-Signature` (sans le préfixe `sha256=`). Toujours vérifier sur le
        corps **brut**, avant tout parsing JSON. Rejeter un `timestamp` trop ancien (ex. > 5 min) pour
        éviter le rejeu.

        **Livraison** : toute réponse 2xx dans les 10 s vaut accusé de réception. Sinon, jusqu'à
        5 tentatives (après 30 s, 2 min, 5 min, 15 min). Un même événement peut donc arriver plusieurs
        fois : dédoublonner sur `id`, identique d'une tentative à l'autre. L'ordre d'arrivée n'est
        pas garanti. De nouveaux événements peuvent apparaître (voir « Versions ») : ignorer un
        `event` inconnu en répondant 2xx.

        En-têtes informatifs : `X-Webhook-Id` (= `id`), `X-Webhook-Event` (= `event`),
        `X-Webhook-Timestamp` (= `timestamp`). Seul le corps signé fait foi.
      required: [id, event, data, timestamp]
      properties:
        id: { type: string, format: uuid, description: "Identifiant de l'événement, stable entre les tentatives." }
        event:
          type: string
          enum: [message.status_changed, campaign.completed, balance.low, otp.verified, otp.failed, test.ping]
        data: { type: object }
        timestamp: { type: integer, description: Horodatage Unix (secondes) de l'envoi de cette tentative. }

    CampaignCompletedData:
      type: object
      required: [campaign_id, name, recipients_count, messages_by_status, credits_charged, completed_at]
      properties:
        campaign_id: { type: string, format: uuid }
        name: { type: string }
        recipients_count: { type: integer }
        messages_by_status:
          type: object
          description: Nombre de messages par statut final.
          additionalProperties: { type: integer }
        credits_charged: { type: integer }
        completed_at: { type: [string, 'null'], format: date-time }

    BalanceLowData:
      type: object
      required: [balance, threshold]
      properties:
        balance: { type: integer, description: Solde après l'opération qui a franchi le seuil. }
        threshold: { type: integer }

    MessageStatusChangedData:
      type: object
      required: [message_id, recipient, status, provider_message_id, campaign_id, reference, error_code, error_message]
      properties:
        message_id: { type: string, format: uuid }
        recipient: { type: string }
        status: { $ref: '#/components/schemas/MessageStatus' }
        provider_message_id: { type: [string, 'null'] }
        campaign_id: { type: [string, 'null'], format: uuid }
        reference: { type: [string, 'null'], description: "`reference` passée à l'envoi (`POST /sms`)." }
        error_code: { type: [string, 'null'], description: Code d'erreur du fournisseur ou de la plateforme en cas d'échec. }
        error_message: { type: [string, 'null'] }

    OtpWebhookData:
      type: object
      description: Issue d'une vérification OTP (`otp.verified`, `otp.failed`). Jamais le code.
      required: [otp_id, phone, status, reason, verified_at]
      properties:
        otp_id: { type: string, format: uuid }
        phone: { type: string, description: 'Numéro normalisé (international sans `+`).', examples: ["243812345678"] }
        status:
          type: string
          enum: [verified, failed, expired]
          description: "`verified` avec `otp.verified` ; `failed` ou `expired` avec `otp.failed`."
        reason:
          description: "`null` si vérifié ; `max_attempts_reached` (statut `failed`) ou `expired` (statut `expired`)."
          oneOf:
            - type: 'null'
            - type: string
              enum: [max_attempts_reached, expired]
        verified_at: { type: [string, 'null'], format: date-time, description: Date de vérification ; `null` pour `otp.failed`. }

  responses:
    Unauthenticated:
      description: "`UNAUTHENTICATED` : clé absente (« Clé API manquante. »), invalide ou révoquée."
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHENTICATED, message: "Clé API invalide.", details: {} } }
    Forbidden:
      description: "`FORBIDDEN` : adresse IP non autorisée pour cette clé ; `ACCOUNT_SUSPENDED` : compte suspendu par la plateforme (toute l'API est fermée jusqu'à réactivation)."
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: "Adresse IP non autorisée pour cette clé API.", details: {} } }
    NotFound:
      description: "`NOT_FOUND` : ressource introuvable pour ce compte."
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NOT_FOUND, message: "Message introuvable.", details: {} } }
    ValidationError:
      description: "`VALIDATION_ERROR` : données invalides (`details` par champ)."
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example: { error: { code: VALIDATION_ERROR, message: "Les données envoyées sont invalides.", details: { per_page: ["Le champ per_page ne doit pas être supérieur à 100."] } } }
    TooManyRequests:
      description: "`TOO_MANY_REQUESTS` : limite de requêtes atteinte. Réessayer après `Retry-After` secondes."
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        X-Api-Version: { $ref: '#/components/headers/X-Api-Version' }
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TooManyRequestsError' }
          example: { error: { code: TOO_MANY_REQUESTS, message: "Trop de requêtes, réessayez plus tard.", details: { retry_after_seconds: 37 } } }
