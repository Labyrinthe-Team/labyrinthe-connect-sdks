# Publication de @labyrinthe/connect sur npm, déclenchée par un tag node-vX.Y.Z.
#
# Prérequis :
#   - secret NPM_TOKEN : jeton npm « Automation » (ou granular, droit publish) d'un membre
#     de l'organisation npm @labyrinthe ;
#   - la version de node/package.json (et de node/src/version.ts) doit être X.Y.Z.
#
# --provenance publie l'attestation de build (Sigstore) : elle exige id-token: write
# et un dépôt public.
name: node-release

on:
  push:
    tags:
      - 'node-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: node-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: node

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Check that the tag matches the package version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#node-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not SemVer (expected node-vX.Y.Z)"; exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [[ "$pkg" != "$version" ]]; then
            echo "::error::package.json is $pkg but the tag is $version"; exit 1
          fi
          # Prerelease (1.1.0-beta.1) → dist-tag "next" au lieu de "latest".
          if [[ "$version" == *-* ]]; then echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"; else echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"; fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run publint
      - run: npm run attw

      - run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
