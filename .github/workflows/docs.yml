# Documentation HTML de l'API (Redocly, openapi/dist/index.html) publiée sur GitHub Pages.
#
# Prérequis (une fois) : Settings > Pages > Build and deployment > Source : « GitHub Actions ».
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'openapi/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours n'est pas annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build API docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: openapi/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: openapi/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
