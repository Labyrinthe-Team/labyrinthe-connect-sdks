# SDK PHP (php/) : style, analyse statique et tests sur toutes les versions de PHP supportées.
name: php

on:
  push:
    branches: [main]
    paths:
      - 'php/**'
      - 'openapi/openapi.yaml'
      - '.github/workflows/php.yml'
  pull_request:
    paths:
      - 'php/**'
      - 'openapi/openapi.yaml'
      - '.github/workflows/php.yml'

permissions:
  contents: read

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: php

jobs:
  quality:
    name: Lint & PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring
          coverage: none

      - run: composer validate --strict

      - uses: ramsey/composer-install@v3
        with:
          working-directory: php

      - run: composer lint
      - run: composer analyse

  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.1'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: php
          dependency-versions: ${{ matrix.dependencies }}

      # Tests unitaires + contrat OpenAPI (../openapi/openapi.yaml). Sans réseau.
      - run: vendor/bin/phpunit --exclude-group integration
