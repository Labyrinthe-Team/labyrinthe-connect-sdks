# Publication de labyrinthe-connect sur PyPI, déclenchée par un tag python-vX.Y.Z.
#
# Trusted Publishing (OIDC) : aucun jeton ni secret. Configuration unique côté PyPI
# (https://pypi.org/manage/account/publishing/, ou « Publishing » du projet une fois créé) :
#   - PyPI project name : labyrinthe-connect
#   - Owner             : labyrinthe-rdc
#   - Repository name   : labyrinthe-connect-sdks
#   - Workflow name     : python-release.yml
#   - Environment name  : pypi
# Côté GitHub : créer l'environnement « pypi » (Settings > Environments), idéalement avec
# des relecteurs obligatoires et une règle limitant les tags à python-v*.
#
# Prérequis : la version de python/pyproject.toml et de src/labyrinthe_connect/_version.py
# doit être X.Y.Z.
name: python-release

on:
  push:
    tags:
      - 'python-v*'

permissions:
  contents: read

concurrency:
  group: python-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: python

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - name: Check that the tag matches the package version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#python-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG is not a release version (expected python-vX.Y.Z or python-vX.Y.ZrcN)"; exit 1
          fi
          pyproject="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          module="$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/labyrinthe_connect/_version.py').read()).group(1))")"
          if [[ "$pyproject" != "$version" || "$module" != "$version" ]]; then
            echo "::error::pyproject.toml is $pyproject, _version.py is $module, but the tag is $version"; exit 1
          fi

      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/labyrinthe-connect/
    permissions:
      id-token: write   # Trusted Publishing (OIDC) + attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
