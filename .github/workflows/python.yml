# SDK Python (python/) : ruff, mypy --strict, build + twine check sur Python 3.13,
# puis tests unitaires + contrat OpenAPI et installation du wheel sur Python 3.9 → 3.13.
name: python

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'openapi/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'openapi/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  quality:
    name: Lint, types, build & package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: twine check --strict dist/*

  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - run: python -m pip install -r requirements-dev.txt -e .
      # Tests unitaires + contrat (../openapi/openapi.yaml). L'intégration est ignorée sans LABYRINTHE_API_KEY.
      - run: pytest --cov --cov-report=term
      # Le wheel doit s'installer et s'importer seul (httpx pour unique dépendance).
      - name: Install the wheel in a fresh virtualenv
        run: |
          python -m build --wheel --outdir /tmp/dist
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install /tmp/dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import labyrinthe_connect as lc; print(lc.__version__, lc.Labyrinthe, lc.AsyncLabyrinthe)"
